<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <!-- 主題：在任何樣式與程式載入前決定深淺色，避免重新整理時閃白。邏輯與 src/utils/theme.ts 相同 -->
    <script>
      (function () {
        var root = document.documentElement;
        var mode = 'system';
        try {
          var raw = localStorage.getItem('themeMode');
          if (raw === 'system' || raw === 'light' || raw === 'dark') mode = raw;
        } catch (e) {}
        var systemDark = false;
        try {
          systemDark = !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
        } catch (e) {}
        var dark = mode === 'dark' || (mode === 'system' && systemDark);
        root.classList.toggle('dark', dark);
        root.style.colorScheme = dark ? 'dark' : 'light';
      })();
    </script>
    <!-- 首屏底色：與 src/styles/app.css 的 --ground 相同，修改時要一起改 -->
    <style>
      html{background:#EEF1EC;color-scheme:light}
      html.dark{background:#0F1916;color-scheme:dark}
    </style>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#EEF1EC" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0F1916" media="(prefers-color-scheme: dark)">
    <title>Huanux ENGLISH</title>
    <meta name="description" content="An advanced English learning application featuring Walkman mode, listening and speaking coaches, and a gamified badge system.">
    <meta property="og:title" content="Huanux ENGLISH">
    <meta property="og:description" content="An advanced English learning application featuring Walkman mode, listening and speaking coaches, and a gamified badge system.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,200..800;1,6..72,200..800&family=Noto+Sans+TC:wght@100..900&display=swap" rel="stylesheet">
</head>
<body>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
</body>
</html>
