# AI 委員會（需求規劃）
#   issue 貼上 ai-plan  → 各 AI 獨立評估，結果留言在 issue
#   issue 貼上 ai-cross → 各 AI 看過第一輪後交叉討論
# 只有 repo 的協作者能貼標籤，陌生人無法觸發
name: AI 委員會

on:
  issues:
    types: [labeled]

permissions:
  contents: read
  issues: write

concurrency:
  group: ai-council-${{ github.event.issue.number }}

jobs:
  council:
    if: github.event.label.name == 'ai-plan' || github.event.label.name == 'ai-cross'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE: ${{ github.event.issue.number }}
      LABEL: ${{ github.event.label.name }}
      OWNER: ${{ github.repository_owner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: 準備需求與專案脈絡
        run: |
          # 需求 = issue 內文 + 擁有者的留言（忽略其他人的留言，避免公開 repo 被注入指令）
          gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE" --jq '"# 需求：\(.title)\n\n\(.body // "")"' > brief.md
          gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$ISSUE/comments" \
            --jq ".[] | select(.user.login == \"$OWNER\") | select(.body | contains(\"<!-- ai-council\") | not) | \"\n### 擁有者補充（\(.created_at)）\n\(.body)\"" >> brief.md || true
          {
            echo; echo "## 專案脈絡"
            echo "### CLAUDE.md"; cat CLAUDE.md 2>/dev/null || true
            echo; echo "### 檔案列表"; git ls-files | grep -v -E '^(package-lock.json|public/)'
            echo; echo "### 原始碼"
            git ls-files 'src/*.ts' 'src/*.tsx' 'netlify/*.ts' \
              | while read -r f; do echo; echo "#### $f"; echo '```'; head -c 15000 "$f"; echo; echo '```'; done
          } > context.md
          # 程式碼太多時以 ai_council.py 的上限截斷；需求永遠放最前面
          cat brief.md context.md > full_brief.md

      - name: 第一輪：獨立評估
        if: env.LABEL == 'ai-plan'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          AI_COUNCIL: ${{ vars.AI_COUNCIL }}
        run: python .github/scripts/ai_council.py plan --brief full_brief.md --out result.md

      - name: 第二輪：交叉討論
        if: env.LABEL == 'ai-cross'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          AI_COUNCIL: ${{ vars.AI_COUNCIL }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$ISSUE/comments" \
            --jq '[.[] | select(.body | contains("<!-- ai-council:plan -->"))] | last | .body // ""' > round1.md
          if [ ! -s round1.md ]; then echo "找不到第一輪意見，請先執行 ai-plan" > result.md; exit 0; fi
          python .github/scripts/ai_council.py cross --brief brief.md --round1 round1.md --out result.md

      - name: 發表結果
        if: always()
        run: |
          [ -s result.md ] || echo "<!-- ai-council:error -->
          ⚠️ AI 委員會執行失敗，請查看 Actions 紀錄（${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}）" > result.md
          gh issue comment "$ISSUE" --body-file result.md
          gh issue edit "$ISSUE" --remove-label "$LABEL" || true
