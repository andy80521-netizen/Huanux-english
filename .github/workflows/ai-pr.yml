# PR 關卡：離線驗證 → 結果留言在 PR（附 commit SHA，讓 Claude 對應是哪一版）
# Claude 的工作環境讀不到 Actions 紀錄，所以結果一律以 PR 留言回報。
# 防作弊檢查在 ai-guard.yml（一律執行 main 上的可信任版本）。
# 程式審查由 Codex 與 Gemini（ai-review.yml）負責（由 Claude 在 PR 留言觸發），不在這裡執行。
#
# 安全：verify 會執行 PR 的程式（測試、build），所以分成兩個 job、跑在兩台不同的機器上：
#   - verify：完全沒有 GitHub token、不保留 git 憑證、npm ci 不執行套件腳本
#   - report：不執行任何 PR 程式，只拿 verify 的結果去留言（PR 程式無法接觸 token、無法偽造回報）
name: PR 驗證

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ai-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    # 草稿（規劃階段）不跑；外部 fork 的 PR 不跑
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      outcome: ${{ steps.check.outcome }}
      tests: ${{ steps.summary.outputs.tests }}
      log: ${{ steps.summary.outputs.log }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 安裝（不執行套件腳本）
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: 離線驗證（型別檢查＋測試＋build）
        id: check
        continue-on-error: true
        run: bash scripts/check.sh 2>&1 | tee check.log

      - name: 整理結果
        id: summary
        if: always()
        run: |
          d="EOF_$(openssl rand -hex 16)"
          echo "tests=$(grep -E '^\s*Tests\s' check.log 2>/dev/null | tail -1 | sed 's/^\s*//' | cut -c1-200)" >> "$GITHUB_OUTPUT"
          { echo "log<<$d"; tail -n 150 check.log 2>/dev/null | cut -c1-400; echo "$d"; } >> "$GITHUB_OUTPUT"

      - name: 結果
        if: steps.check.outcome != 'success'
        run: exit 1

  report:
    needs: verify
    if: always() && (needs.verify.result == 'success' || needs.verify.result == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number }}
      SHA: ${{ github.event.pull_request.head.sha }}
      OUTCOME: ${{ needs.verify.outputs.outcome }}
      TESTS: ${{ needs.verify.outputs.tests }}
      LOG: ${{ needs.verify.outputs.log }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: 留言回報
        run: |
          {
            echo "<!-- ai-pr:sha=$SHA -->"
            if [ "$OUTCOME" = "success" ]; then
              echo "## ✅ 離線驗證通過（\`${SHA:0:7}\`）"
              [ -n "$TESTS" ] && echo "- 測試：$TESTS"
            else
              echo "## ❌ 離線驗證失敗（\`${SHA:0:7}\`）"
              echo; echo '<details open><summary>錯誤輸出（最後 150 行）</summary>'; echo; echo '```'
              printf '%s\n' "$LOG"
              echo '```'; echo '</details>'
            fi
            echo; echo "<sub>[Actions 紀錄]($RUN_URL)</sub>"
          } > comment.md
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file comment.md
