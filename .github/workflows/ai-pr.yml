# PR 關卡：離線驗證 → 結果留言在 PR（附 commit SHA，讓 Claude 對應是哪一版）
# Claude 的工作環境讀不到 Actions 紀錄，所以結果一律以 PR 留言回報。
# 防作弊檢查在 ai-guard.yml（一律執行 main 上的可信任版本）。
# 程式審查由 Codex 與 Gemini Code Assist 負責（由 Claude 在 PR 留言觸發），不在這裡執行。
name: PR 驗證

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ai-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  verify:
    # 草稿（規劃階段）不跑；外部 fork 的 PR 不跑
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number }}
      SHA: ${{ github.event.pull_request.head.sha }}
      BASE: ${{ github.event.pull_request.base.ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安裝
        run: npm ci --no-audit --no-fund

      - name: 離線驗證（型別檢查＋測試＋build）
        id: check
        continue-on-error: true
        run: bash scripts/check.sh 2>&1 | tee check.log

      - name: 留言回報
        if: always()
        run: |
          {
            echo "<!-- ai-pr:sha=$SHA -->"
            if [ "${{ steps.check.outcome }}" = "success" ]; then
              echo "## ✅ 離線驗證通過（\`${SHA:0:7}\`）"
            else
              echo "## ❌ 離線驗證失敗（\`${SHA:0:7}\`）"
              echo; echo '<details open><summary>錯誤輸出（最後 150 行）</summary>'; echo; echo '```'
              tail -n 150 check.log 2>/dev/null | cut -c1-400
              echo '```'; echo '</details>'
            fi
            echo; echo "<sub>[Actions 紀錄](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})</sub>"
          } > comment.md
          gh pr comment "$PR" --body-file comment.md

      - name: 結果
        if: steps.check.outcome != 'success'
        run: exit 1
